<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="RainMan shows the weather along your road trip route and the best time to leave to avoid rain and storms."
    />

    <title>RainMan</title>

    <link rel="icon" type="image/x-icon" href="images/favicon.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/favicon_package/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon_package/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/favicon_package/favicon-16x16.png"
    />
    <link rel="manifest" href="images/favicon_package/site.webmanifest" />
    <link rel="mask-icon" href="images/favicon_package/safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="title">RainMan</div>
      <div class="icon-container">
        <i class="fa-solid fa-umbrella"></i>
      </div>
    </nav>
    <main id="map-container">
      <div id="map"></div>

      <div class="overlay">
        <div id="route-card" role="search">
          <div class="route-fields">
            <div class="route-inputs">
              <input
                id="search-input"
                type="text"
                placeholder="Enter starting point..."
                aria-label="Starting point"
                autocomplete="off"
              />
              <input
                id="destination-input"
                type="text"
                placeholder="Enter destination..."
                aria-label="Destination"
                autocomplete="off"
              />
            </div>
            <button
              id="swap-button"
              type="button"
              aria-label="Swap start and destination"
              title="Swap start and destination"
            >
              &#8645;
            </button>
          </div>
          <div class="route-actions">
            <button id="current-location-button" type="button">Current Location</button>
            <button id="clear-button" type="button">Clear</button>
          </div>
        </div>
        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      </div>

      <div id="weather-info-window" class="weather-info-window" role="dialog" aria-label="Weather details" hidden>
        <img id="weather-info-icon" src="" alt="" />
        <div class="weather-info-text">
          <h3 id="weather-info-location"></h3>
          <p id="weather-info-summary"></p>
          <p id="weather-info-extra" class="muted"></p>
        </div>
        <button id="weather-info-close" type="button" aria-label="Close weather details">&times;</button>
      </div>
    </main>

    <section id="time-bar" aria-label="Best time to leave" hidden>
      <div class="tb-header">
        <img id="tb-icon" class="tb-icon" src="" alt="" hidden />
        <div class="tb-heading">
          <div id="tb-title" class="tb-title"></div>
          <div id="tb-sub" class="tb-sub"></div>
        </div>
        <div id="tb-spinner" class="tb-updating" hidden>
          <span class="spinner" aria-hidden="true"></span>Updating forecast…
        </div>
      </div>
      <div id="tb-scroll" class="tb-scroll">
        <div id="tb-segments" class="tb-segments" role="group" aria-label="Departure hours"></div>
      </div>
      <ul class="tb-legend" aria-label="Legend">
        <li><span class="swatch good"></span>Good</li>
        <li><span class="swatch okay"></span>Okay</li>
        <li><span class="swatch bad"></span>Bad</li>
        <li><span class="swatch night"></span>Night</li>
        <li class="tb-legend-note"><span class="tb-star" aria-hidden="true">★</span> Best window</li>
      </ul>
      <p class="tb-credit">
        Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>
        (CC BY 4.0) · Icons by <a href="https://github.com/basmilius/weather-icons" target="_blank" rel="noopener">Meteocons</a>
      </p>
    </section>

    <script src="scoring.js"></script>
    <script src="weather.js"></script>
    <script src="markers.js"></script>
    <script src="timebar.js"></script>
    <script src="script.js"></script>
    <script
      async
      defer
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA1SxniWxQxRisqBdWp8NZ5OVXbT1dNXBE&libraries=visualization,geometry,places&callback=initMap"
    ></script>
  </body>
</html>
