name: Deploy to Firebase Hosting on PR
"on": pull_request

# The preview-deploy action comments on the PR and creates a check run. Without these the
# default read-only token fails with "Resource not accessible by integration".
permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read # download the accuracy-json artifact of pipeline.yml

jobs:
  build_and_preview:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm --prefix functions test
      - run: npm --prefix functions run build
      - run: npm run build
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Download the latest accuracy.json
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: pipeline.yml
          workflow_conclusion: success
          name: accuracy-json
          path: dist/data
          search_artifacts: true
          if_no_artifact_found: warn

      # With the backend switched on, the preview channel talks to the already deployed function
      # (functions are only deployed from main).
      - name: Add the /api rewrite to firebase.json
        if: ${{ vars.FUNCTIONS_ENABLED == 'true' }}
        run: node scripts/firebase-config.mjs --with-functions

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAINMAN_394303 }}"
          projectId: rainman-394303
