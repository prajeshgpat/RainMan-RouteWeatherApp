name: Deploy to Firebase Hosting on merge
"on":
  push:
    branches:
      - main
  # Also started by the accuracy pipeline (pipeline.yml) after a scheduled run, so the site picks
  # up the new accuracy.json without a code change.
  workflow_dispatch:

permissions:
  contents: read
  actions: read # download the accuracy-json artifact of pipeline.yml

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm --prefix functions test
      - run: npm --prefix functions run build
      - run: npm run build
        env:
          # Public, referrer-restricted browser key, set as a repository variable
          VITE_GOOGLE_MAPS_KEY: ${{ vars.VITE_GOOGLE_MAPS_KEY }}
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # The latest accuracy numbers from the pipeline (the Accuracy page shows "not available yet"
      # when there is none)
      - name: Download the latest accuracy.json
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: pipeline.yml
          workflow_conclusion: success
          name: accuracy-json
          path: dist/data
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Refuse to deploy a build without the Google Maps key
        env:
          VITE_GOOGLE_MAPS_KEY: ${{ vars.VITE_GOOGLE_MAPS_KEY }}
        run: |
          if [ -z "$VITE_GOOGLE_MAPS_KEY" ] || grep -rl "REPLACE_WITH_PUBLIC_REFERRER_RESTRICTED_KEY" dist; then
            echo "::error::Set the VITE_GOOGLE_MAPS_KEY repository variable (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi

      # Backend (Firebase Functions). Off until the project is on the Blaze plan and the deploy
      # service account has the roles in README.md ("Backend"); then set the repository variable
      # FUNCTIONS_ENABLED=true.
      - name: Add the /api rewrite to firebase.json
        if: ${{ vars.FUNCTIONS_ENABLED == 'true' }}
        run: node scripts/firebase-config.mjs --with-functions
      - name: Authenticate to Google Cloud
        if: ${{ vars.FUNCTIONS_ENABLED == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAINMAN_394303 }}"
      - name: Deploy functions
        if: ${{ vars.FUNCTIONS_ENABLED == 'true' }}
        run: npx --yes firebase-tools@13 deploy --only functions --project rainman-394303

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAINMAN_394303 }}"
          channelId: live
          projectId: rainman-394303
