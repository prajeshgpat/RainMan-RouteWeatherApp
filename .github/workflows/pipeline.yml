name: Accuracy pipeline

"on":
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch: # manual run, no inputs
  pull_request:
    paths:
      - "pipeline/**"
      - "shared/scoring_cases.json"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: pipeline

jobs:
  # Lint and test on synthetic fixtures. No secrets, no network access to Open-Meteo.
  checks:
    name: ruff, pytest, dbt build (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - run: ruff check .
      - run: pytest -q
      - name: Load synthetic fixtures
        run: python -m rainman_pipeline.fixtures
      - name: dbt build on synthetic fixtures
        run: dbt build --target dev --profiles-dir .
        working-directory: pipeline/dbt
      - name: Dagster definitions load
        run: dagster definitions validate -m rainman_pipeline.definitions

  # Scheduled / manual: ingest the last few days, rebuild the marts in MotherDuck, export JSON.
  materialize:
    name: materialize against MotherDuck
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # to dispatch the site deploy
    concurrency:
      group: pipeline-materialize
      cancel-in-progress: false
    env:
      RAINMAN_TARGET: prod
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - name: Check for MOTHERDUCK_TOKEN
        id: token
        run: |
          if [ -n "$MOTHERDUCK_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=MotherDuck skipped::The MOTHERDUCK_TOKEN repository secret is not set, so ingestion and the accuracy export were skipped. Add the secret (Settings > Secrets and variables > Actions) and re-run this workflow."
          fi
        working-directory: .
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-python@v5
        if: steps.token.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        if: steps.token.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Materialize all assets
        if: steps.token.outputs.present == 'true'
        run: dagster asset materialize -m rainman_pipeline.definitions --select '*'
      - name: Upload accuracy.json
        if: steps.token.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-json
          path: pipeline/output/accuracy.json
          retention-days: 90
          if-no-files-found: error
      - name: Trigger site deploy
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run firebase-hosting-merge.yml --ref main \
            || echo "::warning title=Site deploy not triggered::firebase-hosting-merge.yml has no workflow_dispatch trigger yet; the new numbers go live on the next deploy."
        working-directory: .
